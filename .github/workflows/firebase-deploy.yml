name: Deploy to Firebase Hosting on Push
on:
  push:
    branches:
      - main  # Change to master if your default branch is master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Fetch the source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js dependencies and compile the React application
      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 3: Deploy the compiled build folder to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: your-firebase-project-id  # <-- Replace with your actual Firebase Project ID
          channelId: live